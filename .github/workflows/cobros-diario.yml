name: Cobros diario

on:
  schedule:
    # GitHub demora las tareas programadas varias horas: se lanzan ventanas
    # tempranas (UTC) y el candado del script evita avisos repetidos.
    - cron: '17 6 * * *'
    - cron: '17 8 * * *'
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Enviar mensaje de prueba a Telegram'
        type: boolean
        default: false

jobs:
  cobros:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar firebase
        run: npm install --no-save --no-audit --no-fund firebase
      - name: Ejecutar script de cobros
        env:
          COBROS_BOT_PASSWORD: ${{ secrets.COBROS_BOT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.prueba }}
        run: node scripts/cobros-diario.mjs
